<!doctype html>
<html lang="en">
	<title>RTMO-s evaluation</title>
	<script type="module">
		import * as ort from './ort.wasm.min.mjs';
		window.rtmo = async () => {
			ort.env.wasm.numThreads = 1;
			ort.env.wasm.wasmPaths = new URL('./', location.href).href;
			const frame = new Image();
			frame.src = './frame.png';
			await frame.decode();
			const ratio = Math.min(640 / frame.width, 640 / frame.height);
			const canvas = document.createElement('canvas');
			canvas.width = canvas.height = 640;
			const ctx = canvas.getContext('2d');
			ctx.fillStyle = 'rgb(114,114,114)';
			ctx.fillRect(0, 0, 640, 640);
			ctx.drawImage(frame, 0, 0, Math.floor(frame.width * ratio), Math.floor(frame.height * ratio));
			const rgba = ctx.getImageData(0, 0, 640, 640).data,
				plane = 640 * 640,
				bgr = new Float32Array(plane * 3);
			for (let i = 0; i < plane; i++)
				for (let c = 0; c < 3; c++) bgr[i + plane * c] = rgba[4 * i + 2 - c];
			const model = await ort.InferenceSession.create('./end2end.onnx', {
				executionProviders: ['wasm']
			});
			try {
				const start = performance.now();
				const { dets, keypoints } = await model.run({
					input: new ort.Tensor('float32', bgr, [1, 3, 640, 640])
				});
				const elapsedMs = Math.round(performance.now() - start);
				let best = 0;
				for (let i = 1; i < dets.dims[1]; i++)
					if (dets.data[i * 5 + 4] > dets.data[best * 5 + 4]) best = i;
				if (!(dets.data[best * 5 + 4] > 0.7) || keypoints.dims[2] !== 17)
					throw new Error('No confident COCO pose');
				const ref = await (await fetch('./reference.json')).json();
				let maxErrorPx = 0,
					maxScoreDiff = 0;
				for (let i = 0; i < 17; i++) {
					const j = (best * 17 + i) * 3;
					maxErrorPx = Math.max(
						maxErrorPx,
						Math.hypot(
							keypoints.data[j] / ratio - ref[i][0],
							keypoints.data[j + 1] / ratio - ref[i][1]
						)
					);
					maxScoreDiff = Math.max(maxScoreDiff, Math.abs(keypoints.data[j + 2] - ref[i][2]));
				}
				return { maxErrorPx, maxScoreDiff, elapsedMs, crossOriginIsolated };
			} finally {
				await model.release();
			}
		};
	</script>
</html>
